name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - requirements: requirements.txt
            tests: tests.test_pipeline
          - requirements: requirements-agent.txt
            tests: tests.test_agent_loop tests.test_agent_web tests.test_bonus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ${{ matrix.requirements }}
      - run: python -m unittest ${{ matrix.tests }} -v
      - run: python -m compileall -q src dags
      - run: docker compose config --quiet
